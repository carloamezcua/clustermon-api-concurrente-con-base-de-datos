<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clustermones Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
      margin: 0;
    }
    h1, h2 { color: #38bdf8; }
    .card {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      max-width: 600px;
      border: 1px solid #334155;
    }
    .badge-monedas {
      display: inline-block;
      background: #ca8a04;
      color: #0f172a;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      margin: 10px 0;
      font-size: 1.1em;
    }
    input, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      margin: 4px 0;
    }
    input {
      background: #0f172a;
      color: #fff;
      width: calc(100% - 20px);
    }
    button {
      background: #0284c7;
      color: white;
      cursor: pointer;
      font-weight: bold;
      margin-right: 6px;
    }
    button:hover { background: #0369a1; }
    .btn-reclamar { background: #eab308; color: #0f172a; }
    .btn-reclamar:hover { background: #ca8a04; }
    .btn-trade { background: #8b5cf6; }
    .btn-trade:hover { background: #7c3aed; }
    .btn-subir { background: #16a34a; }
    .btn-subir:hover { background: #15803d; }
    .btn-liberar { background: #e11d48; }
    .btn-liberar:hover { background: #be123c; }
    .criatura {
      background: #334155;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .resultado {
      margin-top: 10px;
      padding: 8px;
      background: #0f172a;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <h1>🎮 Clustermones Dashboard</h1>

  <!-- SECCIÓN USUARIO -->
  <div class="card">
    <h2>Mi Entrenador</h2>
    <label>ID de Usuario:</label><br>
    <input type="text" id="usuarioId" placeholder="Pega tu ObjectId de usuario aquí">
    <button onclick="cargarTodo()">Cargar Entrenador</button>
    
    <div id="contenedorMonedas" style="display: none;">
      <div class="badge-monedas">💰 Monedas: <span id="cantidadMonedas">0</span></div>
      <br>
      <button class="btn-reclamar" onclick="reclamarMonedas()">Reclamar Recompensa</button>
      <button onclick="hacerTirada()">🎲 Tirada Gacha</button>
    </div>

    <!-- HISTORIAL DE ACTIVIDAD (LOG) -->
    <label style="display:block; margin-top: 12px; font-weight: bold; font-size: 0.9em; color: #94a3b8;">Historial de Actividad (Últimos 10 avisos):</label>
    <div id="logActividad" class="resultado" style="max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;">
      <span style="color: #64748b;">Sin actividad registrada.</span>
    </div>
  </div>

  <!-- SECCIÓN INTERCAMBIO -->
  <div class="card">
    <h2>🤝 Centro de Intercambio</h2>
    <label><b>Tus Datos (Jugador 1):</b></label>
    <input type="text" id="tradeU1" placeholder="Tu ID de usuario">
    <input type="text" id="tradeC1" placeholder="ID de tu Clustermon a entregar">

    <label style="margin-top: 8px; display:block;"><b>Datos de tu Compañero (Jugador 2):</b></label>
    <input type="text" id="tradeU2" placeholder="ID del usuario receptor">
    <input type="text" id="tradeC2" placeholder="ID del Clustermon a recibir">

    <button class="btn-trade" onclick="ejecutarIntercambio()">Realizar Intercambio</button>
  </div>

  <!-- SECCIÓN INVENTARIO -->
  <div class="card">
    <h2>Mis Clustermones</h2>
    <div id="listaCriaturas">Ingresa tu usuario_id y presiona "Cargar Entrenador".</div>
  </div>

  <script>
    const BASE_URL = "http://127.0.0.1:8000";
    const historialLog = [];

    // Función global de log
    function agregarLog(mensajeHtml) {
      const hora = new Date().toLocaleTimeString();
      const linea = `<span style="font-size: 0.85em; color: #94a3b8;">[${hora}]</span> ${mensajeHtml}`;
      
      historialLog.unshift(linea);
      
      if (historialLog.length > 10) {
        historialLog.pop();
      }

      const contenedor = document.getElementById("logActividad");
      contenedor.innerHTML = historialLog.map(item => `<div>${item}</div>`).join("");
    }

    async function actualizarSaldo() {
      const usuarioId = document.getElementById("usuarioId").value.trim();
      if (!usuarioId) return;

      try {
        const resp = await fetch(`${BASE_URL}/usuarios/${usuarioId}`);
        if (resp.ok) {
          const user = await resp.json();
          document.getElementById("cantidadMonedas").innerText = user.monedas;
          document.getElementById("contenedorMonedas").style.display = "block";
          document.getElementById("tradeU1").value = usuarioId;
        }
      } catch (err) {
        console.error("Error al obtener saldo:", err);
      }
    }

    async function cargarTodo() {
      await actualizarSaldo();
      await cargarInventario();
    }

    async function reclamarMonedas() {
      const usuarioId = document.getElementById("usuarioId").value.trim();
      if (!usuarioId) {
        alert("Ingresa un ID de usuario.");
        return;
      }

      agregarLog("Reclamando recompensa...");

      try {
        const resp = await fetch(`${BASE_URL}/usuarios/${usuarioId}/reclamar`, { method: "POST" });
        const data = await resp.json();

        if (!resp.ok) {
          agregarLog(`<span style="color:#f87171;">${data.detail || 'Error al reclamar'}</span>`);
          return;
        }

        agregarLog(`<span style="color:#eab308;">${data.mensaje || '¡Monedas reclamadas con éxito!'}</span>`);
        await actualizarSaldo();
      } catch (err) {
        agregarLog(`<span style="color:#f87171;">Error de conexión con el servidor.</span>`);
      }
    }

    async function cargarInventario() {
      const usuarioId = document.getElementById("usuarioId").value.trim();
      const contenedor = document.getElementById("listaCriaturas");
      
      if (!usuarioId) {
        alert("Por favor ingresa un ID de usuario");
        return;
      }

      contenedor.innerHTML = "Cargando...";

      try {
        const resp = await fetch(`${BASE_URL}/clustermones/${usuarioId}`);
        const data = await resp.json();

        if (!resp.ok) {
          contenedor.innerHTML = `<span style="color:#f87171;">Error: ${data.detail}</span>`;
          return;
        }

        if (!data.clustermones || data.clustermones.length === 0) {
          contenedor.innerHTML = "No tienes Clustermones aún. ¡Haz una tirada!";
          return;
        }

        contenedor.innerHTML = "";
        data.clustermones.forEach(c => {
          contenedor.innerHTML += `
            <div class="criatura">
              <div>
                <strong>${c.nombre}</strong> (${c.rareza}) - Nivel: <b>${c.nivel || 1}</b><br>
                <small style="color:#94a3b8;">ID: ${c.id}</small>
              </div>
              <div>
                <button class="btn-subir" onclick="subirNivel('${c.id}')">Subir Nivel</button>
                <button style="background: #eab308; color: #0f172a;" onclick="simularBatalla('${c.id}')">⚔️ Simular</button>
                <button class="btn-liberar" onclick="liberar('${c.id}')">Liberar</button>
              </div>
            </div>
          `;
        });
      } catch (err) {
        contenedor.innerHTML = `<span style="color:#f87171;">Error al conectar con la API</span>`;
      }
    }

    async function hacerTirada() {
      const usuarioId = document.getElementById("usuarioId").value.trim();
      if (!usuarioId) return;

      agregarLog("Invocando criatura en el gacha...");

      try {
        const resp = await fetch(`${BASE_URL}/clustermones/tirada/${usuarioId}`, { method: "POST" });
        const data = await resp.json();

        if (!resp.ok) {
          agregarLog(`<span style="color:#f87171;">${data.detail}</span>`);
          return;
        }

        agregarLog(`<span style="color:#4ade80;">${data.mensaje}</span>`);
        await actualizarSaldo();
        await cargarInventario();
      } catch (err) {
        agregarLog(`<span style="color:#f87171;">Error de conexión.</span>`);
      }
    }

    async function subirNivel(clustermonId) {
      const usuarioId = document.getElementById("usuarioId").value.trim();
      if (!usuarioId) return;

      try {
        const resp = await fetch(`${BASE_URL}/clustermones/${clustermonId}/subir-nivel/${usuarioId}`, { method: "POST" });
        const data = await resp.json();

        if (!resp.ok) {
          agregarLog(`<span style="color:#f87171;">${data.detail}</span>`);
          return;
        }

        agregarLog(`<span style="color:#4ade80;">${data.mensaje} (Gastaste ${data.monedas_gastadas} monedas)</span>`);
        await actualizarSaldo();
        await cargarInventario();
      } catch (err) {
        alert("Error al subir de nivel");
      }
    }

    async function liberar(clustermonId) {
      const usuarioId = document.getElementById("usuarioId").value.trim();
      if (!usuarioId) return;

      if (!confirm("¿Seguro que quieres liberar este Clustermon por 20 monedas?")) return;

      try {
        const resp = await fetch(`${BASE_URL}/clustermones/${clustermonId}/usuario/${usuarioId}`, { method: "DELETE" });
        const data = await resp.json();

        if (!resp.ok) {
          agregarLog(`<span style="color:#f87171;">${data.detail}</span>`);
          return;
        }

        agregarLog(`<span style="color:#fbbf24;">${data.mensaje}</span>`);
        await actualizarSaldo();
        await cargarInventario();
      } catch (err) {
        alert("Error al liberar");
      }
    }

    async function ejecutarIntercambio() {
      const u1 = document.getElementById("tradeU1").value.trim();
      const c1 = document.getElementById("tradeC1").value.trim();
      const u2 = document.getElementById("tradeU2").value.trim();
      const c2 = document.getElementById("tradeC2").value.trim();

      if (!u1 || !c1 || !u2 || !c2) {
        alert("Debes llenar los 4 campos para realizar el intercambio.");
        return;
      }

      agregarLog("Procesando intercambio entre entrenadores...");

      try {
        const url = `${BASE_URL}/clustermones/intercambiar/${u1}/${c1}/${u2}/${c2}`;
        const resp = await fetch(url, { method: "POST" });
        const data = await resp.json();

        if (!resp.ok) {
          agregarLog(`<span style="color:#f87171;">${data.detail || 'Error en el intercambio'}</span>`);
          return;
        }

        agregarLog(`<span style="color:#a78bfa;">${data.mensaje}</span>`);

        const usuarioActivo = document.getElementById("usuarioId").value.trim();
        if (usuarioActivo === u1 || usuarioActivo === u2) {
          await cargarInventario();
        }
      } catch (err) {
        agregarLog(`<span style="color:#f87171;">Error de conexión con el servidor.</span>`);
      }
    }

    async function simularBatalla(clustermonId) {
      agregarLog("⏳ Simulando batalla en segundo plano (hilo secundario - demora 4s)...");

      try {
        const resp = await fetch(`${BASE_URL}/clustermones/${clustermonId}/simular-batalla`, { method: "POST" });
        const data = await resp.json();

        if (!resp.ok) {
          agregarLog(`<span style="color:#f87171;">${data.detail || 'Error en la simulación'}</span>`);
          return;
        }

        agregarLog(`<span style="color:#eab308;">⚔️ ¡${data.clustermon}! Poder estimado: ${data.poder_calculado} (${data.estado})</span>`);
      } catch (err) {
        agregarLog(`<span style="color:#f87171;">Error de conexión con el servidor.</span>`);
      }
    }
  </script>
</body>
</html>
